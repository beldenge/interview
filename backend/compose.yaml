services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: interview-postgres
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
